name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scope:
        description: 'web: UI only; full: API, schema and web'
        type: choice
        options: [web, full]
        default: web

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ui-quality.yml
  scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.select.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
          BASE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$REQUESTED_SCOPE" == web || "$REQUESTED_SCOPE" == full ]]
            selected="$REQUESTED_SCOPE"
          elif [[ ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ || "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            selected=full
          elif ! git cat-file -e "$BASE_SHA^{commit}"; then
            selected=full
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$TARGET_SHA")"
            if grep -Eq '^(backend/|shared/|scripts/|\.github/|docker-compose|deploy\.sh|\.dockerignore)' <<< "$changed_files"; then
              selected=full
            else
              selected=web
            fi
          fi
          echo "scope=$selected" >> "$GITHUB_OUTPUT"
  deploy:
    needs: [quality, scope]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/ylerp_deploy
          chmod 600 ~/.ssh/ylerp_deploy
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_SCOPE: ${{ needs.scope.outputs.scope }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DEPLOY_SCOPE" == web || "$DEPLOY_SCOPE" == full ]]
          ssh -i ~/.ssh/ylerp_deploy -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 "$SERVER_USER@$SERVER_HOST" "bash -se -- '$DEPLOY_SHA' '$DEPLOY_SCOPE'" < scripts/deploy-production.sh
