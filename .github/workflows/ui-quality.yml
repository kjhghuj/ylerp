name: UI quality

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/web-smoke.test.mjs
      - run: npx eslint components/ui lib
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser critical flows
        run: npx playwright test --grep '@cross-browser'
      - name: Chromium module, theme and viewport matrix
        run: npx playwright test --project=chromium --grep 'all modules'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-browser-results
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
